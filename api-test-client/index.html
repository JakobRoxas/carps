<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Carps API Test</title>
    <link rel="stylesheet" href="https://unpkg.com/7.css">
    <style>
      body {
        min-height: 100vh;
        margin: 0;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .phone-window {
        width: min(360px, calc(100vw - 2rem), calc((100vh - 2rem) * 9 / 20));
        aspect-ratio: 9 / 20;
        display: flex;
        flex-direction: column;
      }

      .phone-window .window-body {
        flex: 1;
        overflow: auto;
      }
    </style>
  </head>
  <body>
    <div class="window active phone-window">
      <div class="title-bar">
        <div class="title-bar-text">Mobile</div>
      </div>
      <div class="window-body has-space">
        
      </div>
    </div>


    <script src="app.js"></script>
  </body>
</html>
